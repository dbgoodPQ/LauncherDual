name: Build Cardputer dual

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PLATFORMIO_CORE_DIR: ${{ github.workspace }}/.pio/core
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Cache PlatformIO
        uses: actions/cache@v5
        with:
          path: .pio/core
          key: ${{ runner.os }}-platformio-dual-${{ hashFiles('platformio.ini') }}
          restore-keys: ${{ runner.os }}-platformio-dual-

      - name: Install PlatformIO
        run: python -m pip install --retries 5 --timeout 120 requests esptool platformio

      - name: Build
        run: platformio run -e m5stack-cardputer-dual

      - uses: actions/upload-artifact@v6
        with:
          name: Launcher-m5stack-cardputer-dual
          path: Launcher-m5stack-cardputer-dual.bin
          if-no-files-found: error
