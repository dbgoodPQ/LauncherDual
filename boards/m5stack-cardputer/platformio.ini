; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:m5stack-cardputer]
board = esp32s3
board_build.arduino.memory_type = qio_qspi
board_build.partitions = support_files/custom_8Mb.csv
# board_build.partitions = support_files/custom_8Mb2.csv # debug
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
build_src_filter =${env.build_src_filter} +<../boards/m5stack-cardputer>
build_flags =
	${env.build_flags}
	-DM5STACK
	-DARDUINO_USB_MODE=1
	-DARDUINO_M5STACK_CARDPUTER=1 # Enable lib\Keyboard\Keyboard*.* files

	-DARDUINO_USB_CDC_ON_BOOT=1
	-DDEVICE_NAME='"M5Stack Cardputer & ADV"'
	-DOTA_TAG='"cardputer"'

	-D LAUNCHER_DEFAULT_SPIFFS_THRESHOLD=0x500000
	-D HAS_KEYBOARD=1
	'-DRESERVED_NAV_KEYS=",\;/\`."'

	-DROTATION=1

	-DANALOG_BAT_PIN=10

	-DTFT_DATABUS_N=0        # Arduino_HWSPI
	-DTFT_DISPLAY_DRIVER_N=1 # Arduino_ST7789
	-DTFT_WIDTH=135
	-DTFT_HEIGHT=240
	-DTFT_BL=38
	-DTFT_RST=33
	-DTFT_DC=34
	-DTFT_MOSI=35
	-DTFT_SCLK=36
	-DTFT_CS=37

	-D TFT_IPS=1
	-D TFT_COL_OFS1=52
	-D TFT_ROW_OFS1=40
	-D TFT_COL_OFS2=53
	-D TFT_ROW_OFS2=40

	-DSDCARD_CS=12
	-DSDCARD_SCK=40
	-DSDCARD_MISO=39
	-DSDCARD_MOSI=14

lib_deps =
	${env.lib_deps}
	adafruit/Adafruit TCA8418 @ ^1.0.1

lib_ignore =
	SensorLib
	XPowersLib


; Cardputer ADV with a second 2" ST7789 (Waveshare 240x320) as a dual screen
; (menu on the built-in screen, open items on the external one). Notes: README_DUAL.md
[env:m5stack-cardputer-dual]
extends = env:m5stack-cardputer
build_flags =
	${env:m5stack-cardputer.build_flags}
	-DEXT_MIRROR=1
	-DEXT_TFT_CS=5
	-DEXT_TFT_DC=6
	-DEXT_TFT_RST=3
	-DEXT_TFT_BL=4 # second screen's backlight: follows brightness, off with the device
	; Lower the external screen's SPI speed if its picture is noisy
	; -DEXT_SPI_SPEED=20000000
